{% extends "base.html" %}
{% block title %}Sifremi Unuttum - PatiliDunya{% endblock %}
{% block content %}
<div class="container">
    <div class="auth-card">
        <h2>🔒 Sifremi Unuttum</h2>
        <p class="subtitle">Kullanici adini gir, sifre sifirlama baglantisi olusturalim.</p>
        <form method="POST">
            <div class="form-group">
                <label class="form-label">Kullanici Adi</label>
                <input type="text" name="username" class="form-control" placeholder="Kullanici adin" required autofocus>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">Baglanti Olustur</button>
        </form>
        <p style="text-align:center; margin-top:1.5rem; font-size:0.9rem;">
            <a href="{{ url_for('login') }}">← Giris sayfasina don</a>
        </p>
    </div>
</div>
{% endblock %}
