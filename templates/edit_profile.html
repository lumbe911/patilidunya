{% extends "base.html" %}
{% block title %}Profili Duzenle - PatiliDunya{% endblock %}
{% block content %}
<div class="container">
    <div class="auth-card" style="max-width: 550px;">
        <h2>Profili Duzenle ✏️</h2>
        <p class="subtitle">Gorunumunu guncelle</p>
        <form method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label class="form-label">Gosterim Adi</label>
                <input type="text" name="display_name" class="form-control" value="{{ current_user.display_name or '' }}" placeholder="Gosterilecek adin">
            </div>
            <div class="form-group">
                <label class="form-label">Hakkimda</label>
                    <textarea name="bio" class="form-control" placeholder="Kendinden bahset... Hayvanlari ne kadar sevdigini anlat 🐱">{{ current_user.bio or '' }}</textarea>
            </div>
            <div class="form-group">
                <label class="form-label">Profil Fotografi</label>
                <div class="upload-zone" onclick="this.querySelector('input').click()">
                    <input type="file" name="avatar" accept="image/*" onchange="previewAvatar(this)">
                    <p id="avatar-label">📷 Profil fotografini sec</p>
                    {% if current_user.avatar %}
                    <img id="avatar-preview" src="{{ current_user.avatar }}" style="width:80px; height:80px; border-radius:50%; object-fit:cover; margin-top:0.5rem;">
                    {% else %}
                    <img id="avatar-preview" style="display:none; width:80px; height:80px; border-radius:50%; object-fit:cover; margin-top:0.5rem;">
                    {% endif %}
                </div>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Kaydet</button>
        </form>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function previewAvatar(input) {
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const preview = document.getElementById('avatar-preview');
            preview.src = e.target.result;
            preview.style.display = 'block';
            document.getElementById('avatar-label').textContent = input.files[0].name;
        }
        reader.readAsDataURL(input.files[0]);
    }
}
</script>
{% endblock %}
