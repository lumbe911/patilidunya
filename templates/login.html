{% extends "base.html" %}
{% block title %}Giriş - Patili Dünya{% endblock %}
{% block ad_top %}{% endblock %}
{% block ad_bottom %}{% endblock %}
{% block content %}
<div class="auth-card">
    <h2>Giriş Yap 🐱</h2>
    <p class="subtitle">Patililerin dünyasına dön</p>
    <form method="POST">
        <div class="form-group">
            <label class="form-label">Kullanıcı Adı</label>
            <input type="text" name="username" class="form-control" placeholder="Kullanıcı adın..." required autofocus>
        </div>
        <div class="form-group">
            <label class="form-label">Şifre</label>
            <input type="password" name="password" class="form-control" placeholder="Şifren..." required>
        </div>
        <div class="form-group" style="display:flex; align-items:center; gap:0.5rem;">
            <input type="checkbox" name="remember" id="remember" checked style="width:18px; height:18px; accent-color:var(--pink-500); cursor:pointer;">
            <label for="remember" style="font-weight:600; font-size:0.9rem; color:var(--gray-500); cursor:pointer;">Beni Hatırla</label>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Giriş Yap</button>
    </form>
    <p style="text-align:center; margin-top:1rem;">
        <a href="{{ url_for('forgot_password') }}" style="font-size:0.85rem; color:var(--pink-500);">Şifremi unuttum</a>
    </p>
    <p style="text-align:center; margin-top:1rem; color: var(--gray-500);">
        Hesabın yok mu? <a href="{{ url_for('register') }}">Kayıt Ol</a>
    </p>
</div>
{% endblock %}
