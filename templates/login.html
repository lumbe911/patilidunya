{% extends "base.html" %}
{% block title %}Giris - PatiliDunya{% endblock %}
{% block content %}
<div class="auth-card">
    <h2>Giris Yap 🐱</h2>
    <p class="subtitle">Patililerin dunyasina don</p>
    <form method="POST">
        <div class="form-group">
            <label class="form-label">Kullanici Adi</label>
            <input type="text" name="username" class="form-control" placeholder="Kullanici adin..." required autofocus>
        </div>
        <div class="form-group">
            <label class="form-label">Sifre</label>
            <input type="password" name="password" class="form-control" placeholder="Sifren..." required>
        </div>
        <div class="form-group" style="display:flex; align-items:center; gap:0.5rem;">
            <input type="checkbox" name="remember" id="remember" checked style="width:18px; height:18px; accent-color:var(--pink-500); cursor:pointer;">
            <label for="remember" style="font-weight:600; font-size:0.9rem; color:var(--gray-500); cursor:pointer;">Beni Hatirla</label>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Giris Yap</button>
    </form>
    <p style="text-align:center; margin-top:1rem;">
        <a href="{{ url_for('forgot_password') }}" style="font-size:0.85rem; color:var(--pink-500);">Sifremi unuttum</a>
    </p>
    <p style="text-align:center; margin-top:1rem; color: var(--gray-500);">
        Hesabin yok mu? <a href="{{ url_for('register') }}">Kayit Ol</a>
    </p>
</div>
{% endblock %}
