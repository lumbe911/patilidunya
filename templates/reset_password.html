{% extends "base.html" %}
{% block title %}Sifre Sifirla - PatiliDunya{% endblock %}
{% block content %}
<div class="container">
    <div class="auth-card">
        <h2>🔑 Yeni Sifre Belirle</h2>
        <p class="subtitle">Yeni sifreni gir ve kaydet.</p>
        <form method="POST">
            <div class="form-group">
                <label class="form-label">Yeni Sifre</label>
                <input type="password" name="password" class="form-control" placeholder="En az 6 karakter" required minlength="6" autofocus>
            </div>
            <div class="form-group">
                <label class="form-label">Sifre Tekrar</label>
                <input type="password" name="password2" class="form-control" placeholder="Sifreni tekrar gir" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">Sifreyi Kaydet</button>
        </form>
        <p style="text-align:center; margin-top:1.5rem; font-size:0.9rem;">
            <a href="{{ url_for('login') }}">← Giris sayfasina don</a>
        </p>
    </div>
</div>
{% endblock %}
