{% extends "base.html" %}
{% block title %}Kayit Ol - PatiliDunya{% endblock %}
{% block content %}
<div class="auth-card">
    <h2>Kayit Ol 🐾</h2>
    <p class="subtitle">Patili dunyaya katil</p>
    <form method="POST">
        <div class="form-group">
            <label class="form-label">Kullanici Adi</label>
            <input type="text" name="username" class="form-control" placeholder="Benzersiz bir kullanici adi" required autofocus minlength="3">
        </div>
        <div class="form-group">
            <label class="form-label">E-posta</label>
            <input type="email" name="email" class="form-control" placeholder="ornek@email.com" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Kayit Ol 🎉</button>
    </form>
    <p style="text-align:center; margin-top:1.5rem; color: var(--gray-500);">
        Zaten hesabin var mi? <a href="{{ url_for('login') }}">Giris Yap</a>
    </p>
</div>
{% endblock %}
