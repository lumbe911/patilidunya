{% extends "base.html" %}
{% block title %}Kayıt Ol - Patili Dünya{% endblock %}
{% block content %}
<div class="auth-card">
    <h2>Kayıt Ol 🐾</h2>
    <p class="subtitle">Patili dünyaya katıl</p>
    <form method="POST">
        <div class="form-group">
            <label class="form-label">Kullanıcı Adı</label>
            <input type="text" name="username" class="form-control" placeholder="Benzersiz bir kullanıcı adı" required autofocus minlength="3">
        </div>
        <div class="form-group">
            <label class="form-label">E-posta</label>
            <input type="email" name="email" class="form-control" placeholder="örnek@email.com" required>
        </div>
        <div class="form-group">
            <label class="form-label">Şifre</label>
            <input type="password" name="password" class="form-control" placeholder="En az 6 karakter" required minlength="6">
        </div>
        <div class="form-group">
            <label class="form-label">Şifre Tekrar</label>
            <input type="password" name="password2" class="form-control" placeholder="Şifreni tekrar gir" required minlength="6">
        </div>
        <div class="form-group" style="font-size:0.85rem;">
            <label style="display:flex; align-items:flex-start; gap:0.5rem; cursor:pointer;">
                <input type="checkbox" name="kvkk" required style="margin-top:0.2rem; flex-shrink:0;">
                <span><a href="{{ url_for('terms') }}" target="_blank">Kullanım Şartları</a>'nı ve <a href="{{ url_for('privacy') }}#kvkk" target="_blank">KVKK Aydınlatma Metni</a>'ni okudum, kabul ediyorum.</span>
            </label>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Kayıt Ol</button>
    </form>
    <p style="text-align:center; margin-top:1.5rem; color: var(--gray-500);">
        Zaten hesabın var mı? <a href="{{ url_for('login') }}">Giriş Yap</a>
    </p>
</div>
{% endblock %}
