{% extends "base.html" %}
{% block title %}Yeni Patili Ekle - PatiliDunya{% endblock %}
{% block content %}
<div class="container">
    <div class="auth-card" style="max-width:600px;">
        <h2>Yeni Patili Ekle 🐱</h2>
        <p class="subtitle">Buldugun hayvanin profilini olustur</p>
        <form method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label class="form-label">Patilinin Adi *</label>
                <input type="text" name="name" class="form-control" placeholder="Ornegin: Pamuk, Misket, Boncuk..." required>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label class="form-label">Yasi</label>
                    <input type="text" name="age" class="form-control" placeholder="Ornegin: 2 yas">
                </div>
                <div class="form-group">
                    <label class="form-label">Cinsiyet</label>
                    <select name="gender" class="form-control">
                        <option value="">Sec...</option>
                        <option value="Female">Kiz</option>
                        <option value="Male">Erkek</option>
                        <option value="Unknown">Bilinmiyor</option>
                    </select>
                </div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label class="form-label">Rengi</label>
                    <input type="text" name="color" class="form-control" placeholder="Ornegin: Beyaz, Gri, Turuncu...">
                </div>
                <div class="form-group">
                    <label class="form-label">Bulma Tarihi</label>
                    <input type="text" name="found_date" class="form-control" placeholder="Ornegin: 15 Mart 2026">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Nerede Bulundu?</label>
                <input type="text" name="location" class="form-control" placeholder="Ornegin: Kizilay, Ankara">
            </div>
            <div class="form-group">
                <label class="form-label">Hikaye / Aciklama</label>
                    <textarea name="description" class="form-control" placeholder="Bu hayvan hakkinda bilinenleri yaz... Nerede buldun? Nasil bir durumdaydi? 📝" rows="4"></textarea>
            </div>
            <div class="form-group">
                <label class="form-label">Fotograflar</label>
                <div class="upload-zone" onclick="this.querySelector('input').click()">
                    <input type="file" name="photos" accept="image/*" multiple onchange="previewPhotos(this)">
                    <p id="photo-label">📷 Bir veya daha fazla fotograf yukle</p>
                    <div id="photo-preview" class="photo-grid"></div>
                </div>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Patiliyi Ekle 🐾</button>
        </form>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function previewPhotos(input) {
    const container = document.getElementById('photo-preview');
    container.innerHTML = '';
    document.getElementById('photo-label').textContent = `${input.files.length} fotograf secildi`;
    Array.from(input.files).forEach(file => {
        const reader = new FileReader();
        reader.onload = function(e) {
            const div = document.createElement('div');
            div.className = 'photo-grid-item';
            div.innerHTML = `<img src="${e.target.result}">`;
            container.appendChild(div);
        }
        reader.readAsDataURL(file);
    });
}
</script>
{% endblock %}
