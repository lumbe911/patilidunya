services:
  - type: web
    name: patilidunya
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 30 --max-requests 1000 --max-requests-jitter 100 --limit-request-line 4094 --limit-request-field_size 4094
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: patilidunya-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0
    plan: free
    healthCheckPath: /

databases:
  - name: patilidunya-db
    plan: free
    databaseName: patilidunya
