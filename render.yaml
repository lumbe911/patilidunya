services:
  - type: web
    name: patilidunya
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: patilidunya-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0
    plan: free
    healthCheckPath: /

databases:
  - name: patilidunya-db
    plan: free
    databaseName: patilidunya
